<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xCapital Terminal - Chart</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://cdn.boxicons.com/3.0.8/fonts/basic/boxicons.min.css" rel="stylesheet">
</head>
<body>
    <div class="topbar">
        
        <a href="#" class="active"><span>F1</span> CHART</a>
        <a href="#"><span>F2</span> ECONOMIC DATA</a>
        <a href="#"><span>F3</span> NEWS</a>
        <a href="#"><span>F4</span> JOURNAL</a>
        <a href="#"><span>F5</span> PORTOFOLIO</a>
        <a href="#"><span>F6</span> ACCOUNT</a>

    </div>

    <main class="main-content">
        <div class="bar">
            <div class="nav">
                <p>Layout : </p>
                <button type="button" class="active" data-chart-count="2" aria-pressed="true">2x</button>
                <button type="button" data-chart-count="3" aria-pressed="false">3x</button>
                <button type="button" data-chart-count="4" aria-pressed="false">4x</button>
            </div>

            <div class="time">
                <p>Time :</p>
                <time class="clock" id="clock" aria-label="Time Now"></time>
            </div>
        </div>

        <section class="chart-panel" id="chart-grid" data-chart-count="2" aria-label="TradingView charts">
            <script id="tradingview-config" type="application/json">
                {
                    "autosize": true,
                    "symbol": "OANDA:XAUUSD",
                    "interval": "240",
                    "timezone": "Etc/UTC",
                    "theme": "dark",
                    "style": "1",
                    "locale": "en",
                    "allow_symbol_change": true,
                    "calendar": false,
                    "hide_side_toolbar": false,
                    "support_host": "https://www.tradingview.com"
                }
            </script>
        </section>

    </main>
    
<script src="../frontend/js/script.js"></script>
<script src="../frontend/js/page-switch.js"></script>
</body>
</html>
