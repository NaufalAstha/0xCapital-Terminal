<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>0xCapital Terminal - Journal</title>
    <link rel="stylesheet" href="../css/journal.css">
</head>
<body>
   <div class="topbar">
        
        <a href="../index.html"><span>F1</span> CHART</a>
        <a href="../page/economic-data.html"><span>F2</span> ECONOMIC DATA</a>
        <a href="../page/news.html"><span>F3</span> NEWS</a>
        <a href="../page/journal.html" class="active"><span>F4</span> JOURNAL</a>
        <a href="../page/portofolio.html"><span>F5</span> PORTOFOLIO</a>
        <a href="../page/account.html"><span>F6</span> ACCOUNT</a>
    </div>

    <main>
        <div class="history">
            <div class="history-trade">
                <p>20.11.2026</p>
                <p>SELL</p>
                <p>PROFIT</p>
                <P>+36.75</P>
            </div>
        </div>

        <div class="container">

            <div class="button-group">
                <button class="buy active" data-side="buy">1 BUY</button>
                <button class="sell" data-side="sell">2 SELL</button>
            </div>
            
            <div class="dropdown">
                <div class="pair-Select">
                    <P>PAIR :</P>
                    <select name="pair" id="pair">
                        <option value="xau">XAU / USD</option>
                        <option value="euro">EURO / USD</option>
                        <option value="jpy">USD / JPY</option>
                        <option value="chf">USD / CHF</option>
                        <option value="aud">USD / AUD</option>
                    </select>
                </div>

                <div class="orderType">
                    <p>ORDER TYPE :</p>
                    <select name="orderType" id="orderType">
                        <option value="">LIMIT ORDER</option>
                        <option value="">MARKET ORDER</option>
                        <option value="">BUY STOP</option>
                        <option value="">SELL STOP</option>
                    </select>
                </div>
            </div>
            
            <div class="input-group">

                <div class="input-group">

                <div class="title-group">
                    <p class="title">LOT SIZE :</p>

                    <button type="button" id="small-lot" class="presetLot" data-target="inputLot" data-value="0,01">0,01</button>
                    <button type="button" id="mid-lot" class="presetLot" data-target="inputLot" data-value="0,1">0,1</button>
                    <button type="button" id="big-lot" class="presetLot" data-target="inputLot" data-value="1">1</button>
                </div>

                <div class="size">
                    <div class="input">
                        <p>SIZE (LOT)</p>
                        <input type="text" id="inputLot" class="numberFormat" inputmode="decimal" placeholder="0,01">
                    </div>
                </div>

                <p class="title">ENTRY :</p>
                <div class="entry"> 
                    <button type="button" class="addButton" data-target="inputEntry" data-step="-100">-</button>

                    <div class="input">
                        <p>PRICE ($)</p>
                        <input type="text" class="numberFormat" id="inputEntry" inputmode="decimal" placeholder="2.100">
                    </div>

                    <button type="button" class="addButton" data-target="inputEntry" data-step="100">+</button>
                </div>

                <p class="title">TAKE PROFIT :</p>
                <div class="take-profit">
                    <button type="button" class="addButton" data-target="inputTP" data-step="-100">-</button>

                    <div class="input">
                        <p>PRICE ($)</p>
                        <input type="text" class="numberFormat" id="inputTP" inputmode="decimal" placeholder="2.200">
                    </div>

                    <button type="button" class="addButton" data-target="inputTP" data-step="100">+</button>
                </div>

                <p class="title">STOP LOSS :</p>
                <div class="stop-loss">
                    <button type="button" class="addButton" data-target="inputSL" data-step="-100">-</button>

                    <div class="input">
                        <p>PRICE ($)</p>
                        <input type="text" class="numberFormat" id="inputSL" inputmode="decimal" placeholder="2.000">
                    </div>

                    <button type="button" class="addButton" data-target="inputSL" data-step="100">+</button>
                </div>

                <div class="result">
                    <p>EST. PROFIT ($) : <span id="profitResult">-</span></p>
                    <p>EST. LOSS ($): <span id="lossResult">-</span></p>
                </div>

                <p class="title">NOTE (OPTIONAL) :</p>
                <div class="thesis">
                    <input type="text" placeholder="ANTROPHIC IPO">
                </div>

                <div class="execution">
                    <button type="button">PLACE ORDER</button>
                </div>
            </div>

        </div>
    </main>

<script src="../js/journal.js"></script>
<script src="../frontend/js/script.js"></script>
<script src="../js/page-switch.js"></script>
</body>
</html>
